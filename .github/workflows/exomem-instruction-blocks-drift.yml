name: Exomem instruction blocks drift

# Fails when docs/prominence.md on Exomem main no longer matches the blocks that
# Home hands out. The failed run is the signal; refresh with
# `npm run sync:instruction-blocks -- <path-to-exomem-repo>`.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch the doc from Exomem main
        run: curl -fsSL -o "$RUNNER_TEMP/prominence.md" https://raw.githubusercontent.com/Artexis10/exomem/main/docs/prominence.md
      - run: node scripts/sync-exomem-instruction-blocks.mjs --check "$RUNNER_TEMP/prominence.md"
