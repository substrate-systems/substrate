name: Exomem instruction blocks drift

# Fails when docs/prominence.md on Exomem main no longer matches the blocks that
# Home hands out, or when tests/fixtures/mcp_cloud_only_tool_schemas.json no longer matches
# the transfer tool contract (names, actions, input properties) the gateway compiles against. The failed
# run is the signal; refresh both with
# `npm run sync:instruction-blocks -- <path-to-exomem-repo>`.
# Also fails when docs/benchmarks.md on Exomem main differs from the copy the
# landing's recall figures came from; refresh src/app/exomem/landing/recall-benchmarks.json.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch the doc and the tool schemas from Exomem main
        run: |
          curl -fsSL -o "$RUNNER_TEMP/prominence.md" https://raw.githubusercontent.com/Artexis10/exomem/main/docs/prominence.md
          curl -fsSL -o "$RUNNER_TEMP/mcp_cloud_only_tool_schemas.json" https://raw.githubusercontent.com/Artexis10/exomem/main/tests/fixtures/mcp_cloud_only_tool_schemas.json
      - run: node scripts/sync-exomem-instruction-blocks.mjs --check "$RUNNER_TEMP/prominence.md" "$RUNNER_TEMP/mcp_cloud_only_tool_schemas.json"
      - name: Fetch the benchmark doc from Exomem main
        if: ${{ !cancelled() }}
        run: curl -fsSL -o "$RUNNER_TEMP/benchmarks.md" https://raw.githubusercontent.com/Artexis10/exomem/main/docs/benchmarks.md
      - name: Check the landing's recall figures
        if: ${{ !cancelled() }}
        run: node scripts/check-exomem-benchmarks.mjs "$RUNNER_TEMP/benchmarks.md"
