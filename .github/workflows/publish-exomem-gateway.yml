name: Publish Exomem gateway

on:
  workflow_dispatch:

concurrency:
  group: publish-exomem-gateway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Admit only canonical main source after primary CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "substrate-systems/substrate"
          test "$GITHUB_REF" = "refs/heads/main"
          ci_run_id="$(
            gh api --paginate --slurp \
              "/repos/substrate-systems/substrate/actions/workflows/test.yml/runs?event=push&head_sha=${GITHUB_SHA}&per_page=100" \
              | node --input-type=module -e '
                  import { readFileSync } from "node:fs";
                  const pages = JSON.parse(readFileSync(0, "utf8"));
                  const run = pages
                    .flatMap((page) => page.workflow_runs ?? [])
                    .find(
                      ({ head_sha, head_branch, conclusion }) =>
                        head_sha === process.env.GITHUB_SHA &&
                        head_branch === "main" &&
                        conclusion === "success"
                    );
                  if (!run) {
                    console.error("No successful test.yml push run exists for this main SHA");
                    process.exit(1);
                  }
                  process.stdout.write(String(run.id));
                '
          )"
          test -n "$ci_run_id"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish the source-bound gateway image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.exomem-gateway
          platforms: linux/amd64
          push: true
          tags: ghcr.io/substrate-systems/substrate-gateway:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/substrate-systems/substrate
          provenance: mode=max
          sbom: true
      - name: Attest the exact gateway image
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ghcr.io/substrate-systems/substrate-gateway
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify anonymous gateway manifest pull
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          pull_token="$(
            curl --fail --silent --show-error \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:substrate-systems/substrate-gateway:pull" \
              | node --input-type=module -e '
                  import { readFileSync } from "node:fs";
                  const { token } = JSON.parse(readFileSync(0, "utf8"));
                  if (!token) process.exit(1);
                  process.stdout.write(token);
                '
          )"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${pull_token}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/substrate-systems/substrate-gateway/manifests/${IMAGE_DIGEST}" \
            > /dev/null
