name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: substrate_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d substrate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Hosted Exomem reviewer bootstrap PostgreSQL race matrix
        env:
          EXOMEM_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/substrate_test
          CONFIRM_ENDSTATE_CLOUD_RELEASE_A: "yes"
        run: >-
          node --import tsx --experimental-test-module-mocks --test
          src/lib/exomem-hosted/__tests__/oauth-bootstrap-postgres.integration.test.ts
      - name: Hosted Exomem PostgreSQL authority and paired acceptance
        env:
          EXOMEM_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/substrate_test
          CONFIRM_ENDSTATE_CLOUD_RELEASE_A: "yes"
        run: >-
          node --import tsx --experimental-test-module-mocks --test
          src/lib/exomem-hosted/__tests__/oauth-postgres.integration.test.ts
          src/lib/exomem-hosted/__tests__/agent-contract-postgres.integration.test.ts
          src/lib/exomem-hosted/__tests__/d1-expand-preflight-postgres.integration.test.ts
          src/lib/exomem-hosted/__tests__/capacity-postgres.integration.test.ts
          src/lib/exomem-hosted/__tests__/migration-upgrade.integration.test.ts
          src/lib/exomem-hosted/__tests__/hosted-paired-acceptance.test.ts
          src/lib/exomem-hosted/__tests__/platform-cohort-postgres.integration.test.ts
          src/lib/exomem-hosted/__tests__/agent-contract-routing-cas.integration.test.ts
          src/lib/exomem-hosted/__tests__/migration-runner.integration.test.ts
          src/lib/exomem-hosted/__tests__/postgres.integration.test.ts
      - name: Hosted Backup version-commit and lifecycle PostgreSQL authority
        env:
          EXOMEM_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/substrate_test
        run: >-
          node --import tsx --experimental-test-module-mocks --test
          src/lib/hosted-backup/__tests__/version-commit-postgres.integration.test.ts

  e2e:
    name: onboarding end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `--with-deps` shells out to apt-get, which blocks indefinitely whenever the
      # Ubuntu archive is degraded rather than failing: on 2026-08-19 two consecutive
      # runs sat fourteen minutes fetching InRelease and were killed by the job
      # timeout, reporting a red e2e job for a diff that never reached a test.
      # Bound the apt path so a stalled archive cannot consume the job, and fall back
      # to the browser binary alone. The runner image already carries chromium's
      # system libraries; if one is genuinely absent, `npx playwright test` says so
      # loudly on launch, which is a far better failure than a silent fifteen-minute
      # hang that looks like the change under test.
      - name: Install Playwright browser
        timeout-minutes: 8
        run: >-
          timeout 300 npx playwright install --with-deps chromium
          || npx playwright install chromium
      # Built here rather than left to the Playwright web server, so a stale
      # `.next` can never serve old code to a passing assertion. No database:
      # every spec stubs the API routes it drives.
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
