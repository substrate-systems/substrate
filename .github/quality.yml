# Configuration for the engineering practices quality job (.github/workflows/test.yml).
# Schema and behaviour: https://github.com/Artexis10/engineering-practices

# Proof weight. A file is product if it runs in a build, a deploy, an image, a
# scheduled job or a runtime import, or ships in a bundle; it is proof (fixtures,
# tests, scripts, tooling, specs) only if it never does. Directories that mix the
# two (scripts/, contracts/, .github/workflows/) name their proof files, so a new
# script, contract or workflow counts as product; a directory that never ships and
# that product code never imports keeps a glob. A file takes the first class whose
# pattern matches; `*` also matches `/`. Lockfiles: the action classes them as
# generated.
classes:
  fixtures: ["*/__tests__/fixtures/*", "*/__tests__/*fixture*"]
  tests: ["*/__tests__/*", "*.test.ts", "*.test.tsx", "e2e/*", "playwright.config.ts"]
  # Dev and validation tooling and read-only checks.
  scripts:
    - "scripts/dev.ps1"
    - "scripts/openspec_validate.ps1"
    - "scripts/verify-exomem-gateway-publication.mjs"
    - "scripts/sync-exomem-instruction-blocks.mjs" # run by hand to refresh the Home instruction blocks
    - "scripts/check-exomem-benchmarks.mjs" # run weekly by the drift workflow to keep the landing's recall figures in step
    - "scripts/render-exomem-email-assets.tsx" # run by hand to redraw the email images after a design change
  tooling:
    - ".github/quality.yml"
    - ".github/workflows/test.yml"
    - ".github/workflows/exomem-instruction-blocks-drift.yml" # weekly check, fails on drift; ships nothing
    - ".claude/*" # agent settings and skills; never ships
    - ".gitignore"
    - ".gitattributes"
    - "lefthook.yml"
    - "eslint.config.mjs"
    - "stylelint.config.mjs"
    - ".prettierrc.json"
    - "contracts/bws-exomem-production-v1.json" # the operator's secret-binding check, run by hand
  specs: ["openspec/*"]
  product:
    - "src/*"
    - "migrations/*"
    - "content/*"
    - "public/*"
    - "ops/*" # the hosted scheduler's cron jobs
    # Run by every production deploy (vercel-build) or by the gateway image build.
    - "scripts/vercel-maybe-migrate.ts"
    - "scripts/migrate.ts"
    - "scripts/*.sql" # the database grants migrate.ts applies
    - "scripts/verify-exomem-gateway-bundle.mjs"
    # Change production data when an operator runs them.
    - "scripts/import-legacy-patron.ts"
    - "scripts/reconcile-legacy-generations.ts"
    - "scripts/strict-generation-visibility-cutover.ts"
    - "scripts/generate-jwt-keypair.ts" # `--commit` inserts the public key into signing_keys
    - ".github/workflows/publish-exomem-gateway.yml" # builds and publishes the gateway image
    - "instrumentation.ts"
    - "next.config.ts"
    - "tailwind.config.ts"
    - "postcss.config.mjs"
    - "tsconfig.json"
    - "vercel.json"
    - "Dockerfile.exomem-gateway"
    - "package.json"
  docs: ["*.md", "docs/*"]

# The dead-code gate. knip's Next.js, esbuild, Node test runner, Playwright and
# GitHub Actions plugins already find the app and pages routes, src/proxy.ts,
# instrumentation.ts, the esbuild-bundled gateway, the *.test.ts files and the
# e2e specs; package.json or a test reaches most scripts. The entries they miss:
javascript:
  knip:
    entry:
      # `npm test` runs src/**/*.test.tsx too; the Node plugin only knows *.test.ts.
      - "src/**/*.test.tsx"
      # Run by hand from the README; nothing else references it.
      - "scripts/generate-jwt-keypair.ts"
      # Run by hand to redraw the email images; its header says how.
      - "scripts/render-exomem-email-assets.tsx"
      # Home's suite has its own Playwright config, which the plugin does not look for;
      # its webServer command starts serve.ts.
      - "e2e/exomem-home/playwright.config.ts"
      - "e2e/exomem-home/serve.ts"
      # The workflow preloads this boundary through NODE_OPTIONS, outside static imports.
      - "e2e/exomem-home/deny-external.mjs"
      # The root config names the journey's warm-up only when the journey database is set.
      - "e2e/exomem-journey/warm-up.ts"
    # Design references (boards, prototypes, locked CSS); never built or imported.
    ignore: ["docs/**"]

# Exact token clones, on code only: OpenSpec deltas repeat requirement text by design.
duplicates:
  paths: ["src", "scripts", "e2e"]

test_jobs: ["test", "onboarding end-to-end"]
