<?xml version="1.0" encoding="UTF-8"?>
<!-- Exomem placeholder monogram. Matches the "E" lockup used in /exomem/og.
     Geometric bars (not typographic) so it stays crisp at 16px favicon sizes.
     Temporary until a proper Exomem mark is designed. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <rect x="5" y="5" width="90" height="90" rx="20" fill="#0a0a0a" stroke="#f5f5f5" stroke-opacity="0.16" stroke-width="2"/>
  <g fill="#f5f5f5">
    <rect x="34" y="30" width="9" height="40" rx="1.5"/>
    <rect x="34" y="30" width="32" height="9" rx="1.5"/>
    <rect x="34" y="45.5" width="24" height="9" rx="1.5"/>
    <rect x="34" y="61" width="32" height="9" rx="1.5"/>
  </g>
</svg>
