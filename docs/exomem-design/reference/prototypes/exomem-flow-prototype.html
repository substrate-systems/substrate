<style>
/* One look on purpose: Exomem's phosphor amber on warm black, the same in every theme. */
:root{--ground:#0A0908;--ink:#ECE9E2;--muted:#A39E93;color-scheme:dark}
html,body{background:var(--ground);color:var(--ink)}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
body{margin:0;overflow-x:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{min-height:100vh}
/* the Exomem scrollbar (R15), for the page itself */
:root{--sb:236,233,226;--sb-a:#FFB000}
:root[data-theme="light"]{--sb:26,24,20;--sb-a:#A86E00}
@supports not selector(::-webkit-scrollbar){html,html *{scrollbar-width:thin;scrollbar-color:rgba(var(--sb),.22) transparent}}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background-color:rgba(var(--sb),.16);border-radius:12px;border:4px solid transparent;background-clip:padding-box}
:hover::-webkit-scrollbar-thumb{background-color:rgba(var(--sb),.26)}
::-webkit-scrollbar-thumb:hover{background-color:rgba(var(--sb),.42);border-width:3px}
::-webkit-scrollbar-thumb:active{background-color:var(--sb-a);border-width:3px}
.viewbar{position:fixed;right:12px;bottom:12px;z-index:60;display:flex;gap:2px;padding:3px;border-radius:10px;background:rgba(20,18,15,.92);border:1px solid rgba(236,233,226,.14)}
.viewbar button{height:30px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--muted);font:12px "IBM Plex Mono",ui-monospace,monospace;cursor:pointer}
.viewbar button[aria-pressed="true"]{background:#2A2724;color:var(--ink)}
.viewbar button:focus-visible{outline:2px solid #FFB000;outline-offset:2px}
.boot{display:flex;min-height:100vh;align-items:center;justify-content:center;font:13px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted)}
</style>

// In-page links glide to their section (and jump when the reader asks for less motion).
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href^="#lp-"]');
  if (!a) return;
  var t = document.getElementById(a.getAttribute('href').slice(1));
  if (!t) return;
  e.preventDefault();
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  t.scrollIntoView({ behavior: still ? 'auto' : 'smooth', block: 'start' });
});
</script>

n class=\"cat\">{{ b.cat }}<\/span><span><sc-for list=\"{{ b.segs }}\" as=\"g\" hint-placeholder-count=\"1\"><span class=\"{{ g.c }}\" onClick=\"{{ g.pick }}\">{{ g.t }}<\/span><\/sc-for><\/span><\/div><\/sc-if>\n            <\/sc-for>\n          <\/div>\n          <div style=\"height: 1px; background: rgba(var(--v12),.08); margin: 8px 0\"><\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 2px\">\n            <span class=\"mono\" style=\"font-size: 11px; color: var(--v2); padding-bottom: 4px\">LINKS \u00b7 {{ relCount }}<\/span>\n            <sc-for list=\"{{ rdGroups }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; flex-direction: column; padding: 6px 0; border-bottom: 1px solid rgba(var(--v12),.06)\">\n                <span class=\"mono\" style=\"font-size: 11px; color: {{ r.col }}; padding-bottom: 2px\">{{ r.k }}<\/span>\n                <sc-for list=\"{{ r.items }}\" as=\"it\" hint-placeholder-count=\"2\"><div class=\"prow\" onClick=\"{{ it.pick }}\" style=\"border: 0; padding: 4px 0\"><span class=\"pt\" style=\"flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ it.t }}<\/span><\/div><\/sc-for>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 2px\">\n            <span class=\"mono\" style=\"font-size: 11px; color: var(--v2); padding-bottom: 4px\">SOURCES<\/span>\n            <sc-for list=\"{{ sources }}\" as=\"s\" hint-placeholder-count=\"2\">\n              <div class=\"prow\" onClick=\"{{ s.pick }}\"><span class=\"mono\" style=\"color: var(--v1); font-size: 11px\">\u21b3<\/span><span class=\"pt\" style=\"flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ s.t }}<\/span><span class=\"mono\" style=\"font-size: 11px; color: var(--v2)\">{{ s.d }}<\/span><\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 2px\">\n            <span class=\"mono\" style=\"font-size: 11px; color: var(--v2); padding-bottom: 4px\">HISTORY<\/span>\n            <sc-for list=\"{{ rdHist }}\" as=\"h\" hint-placeholder-count=\"4\">\n              <div class=\"feed\"><span class=\"mono\" style=\"font-size: 11px; color: var(--v2); width: 84px; flex: none\">{{ h.k }}<\/span><span style=\"flex: 1; color: var(--v11)\">{{ h.t }}<\/span><\/div>\n            <\/sc-for>\n          <\/div>\n      <\/article>\n    <\/div>\n  <\/sc-if>\n<\/main>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"live\":{\"editor\":\"boolean\",\"default\":true},\"theme\":{\"editor\":\"enum\",\"default\":\"dark\",\"options\":[\"dark\",\"light\"]},\"device\":{\"editor\":\"enum\",\"default\":\"desktop\",\"options\":[\"desktop\",\"phone\"]},\"start\":{\"editor\":\"enum\",\"default\":\"overview\",\"options\":[\"overview\",\"note\",\"why\",\"read\",\"review\",\"types\",\"reviewed\"]},\"screenH\":{\"editor\":\"number\",\"default\":844},\"$preview\":{\"width\":1440,\"height\":900}}'>\n// Exomem's graph viewer over a sample vault. One colour: amber lights only what is live, retrieved or current.\n// Overview first; zoom and filter; details on demand. Click a note and the camera moves to it, its links gather\n// around it, labelled by type. Ask why, and the trail that backs it lights up. Disagreements wait for review.\nconst W = 1040, H = 700;\nconst HUBS = [\n  { t: 'notes/newer-constraint.md', kind: 'decision', status: 'current', domain: 'retrieval', sum: 'Retrieval stays local and on SQLite: FTS5 for keywords, sqlite-vec for vectors. No separate search service to run or keep in sync.', supOn: 'superseded 3 Aug \u00b7 after benchmark run 014', src: [['sources/bench/run-014.md', '12 Jul'], ['sources/meeting-2026-05-12.md', '12 May']],\n    why: 'Benchmark run 014 measured hybrid retrieval on SQLite alone at 864 ms, with 50,000 notes and a cold cache. That took away the reason for a separate search service.' },\n  { t: 'decisions/gpu-batching.md', kind: 'decision', status: 'current', domain: 'embeddings', sum: 'Batch embeddings at 256 on 16 GB cards. VRAM headroom, not throughput, is the bound.', src: [['sources/bench/run-014.md', '12 Jul']],\n    why: 'In run 014, batches above 256 ran out of VRAM on 16 GB cards while throughput stayed flat.' },\n  { t: 'research/embedding-models.md', kind: 'research', status: 'current', domain: 'research', sum: 'Five embedding models compared on this vault: recall at 10, latency, and size on disk.', src: [['sources/papers/mteb-2026.md', '20 Jun'], ['sources/bench/run-009.md', '24 Jun']],\n    why: 'It\u2019s a comparison, not a verdict: one paper and one benchmark run, both measured on this vault.' },\n  { t: 'insights/first-latency.md', kind: 'insight', status: 'current', domain: 'latency', sum: 'Cold-start latency is dominated by opening the index, not by retrieval. Warm it when an assistant connects.', src: [['sources/bench/run-014.md', '12 Jul']],\n    why: 'In run 014 most of the first query\u2019s time went to opening the index; warm queries were fast.' },\n  { t: 'sources/bench/run-014.md', kind: 'source', status: 'evidence', domain: 'benchmarks', sum: 'Benchmark run 014: 50,000 notes, hybrid retrieval, 864 ms end to end with a cold cache.', src: [],\n    why: 'It\u2019s evidence, not a conclusion: a recorded benchmark run. Notes cite it; it cites nothing.' },\n  { t: 'decisions/vault-layout.md', kind: 'decision', status: 'current', domain: 'vault', sum: 'Notes live as plain Markdown in the vault; the index is a sidecar that can always be rebuilt from the files.', src: [['sources/meeting-2026-04-02.md', '2 Apr']],\n    why: 'Decided on 2 Apr: the Markdown files stay the source of truth, so the index can always be rebuilt from them.' },\n  { t: 'research/cli-indexing.md', kind: 'research', status: 'open question', domain: 'indexing', sum: 'Should the CLI index on save or on a schedule? Two benchmarks disagree.', src: [['sources/bench/run-012.md', '5 Jul']],\n    why: 'It isn\u2019t settled. Two benchmarks disagree, so it stays an open question until one of them is superseded.' },\n];\nconst OLD_PLAN = 'notes/old-plan.md';\nconst OLD_SUM = 'The first plan: run a separate vector database next to the vault. Benchmark run 014 showed SQLite alone stays sub-second at 50,000 notes, so it was superseded.';\nconst NOTES = ['notes/index-rebuild.md', 'insights/rerank-cost.md', 'patterns/cache-warm.md', 'decisions/fts5.md', 'research/rrf-k.md', 'sources/issue-212.md', 'notes/vault-sync.md', 'insights/edge-cases.md', 'decisions/no-gpu-default.md', 'research/chunking.md', 'sources/meeting-2026-06-30.md', 'patterns/supersede-not-delete.md', 'notes/ocr-pipeline.md', 'insights/recall-at-10.md', 'research/hybrid-weights.md', 'decisions/plugin-route.md'];\nconst TYPES = ['supports', 'refines', 'contradicts', 'supersedes', 'relates'];\nconst TCOL = { supports: 'var(--v1)', refines: 'var(--v1)', contradicts: 'var(--v0)', supersedes: 'var(--v1)', relates: 'var(--v2)' };\nconst OTHER_TYPES = ['evidenced by', 'derived from', 'cites', 'answers', 'raises question', 'resolves', 'depends on', 'implements', 'mitigates', 'causes', 'caused by', 'blocks', 'tests', 'duplicates', 'used for', 'observed in', 'mentions', 'about entity', 'links to', 'part of', 'contains', 'extends', 'member of', 'owns', 'operates', 'produces', 'supplies', 'located at'];\n// What two notes say when they may disagree. The vault is about running a knowledge base, so its arguments are too.\nconst CLAIMS = [\n  ['Index each note when it\u2019s saved, so recall is never stale.', 'Index on a schedule; saving should never wait on the index.'],\n  ['Typed links should rank ahead of plain wikilinks in recall.', 'Plain wikilinks are enough; typing them adds work for no ranking gain.'],\n  ['Tune ranking from how I actually search; cited notes are the signal.', 'Keep ranking fixed; tuning from usage will drift.'],\n  ['Adopt a tuned ranking only if the golden queries don\u2019t get worse.', 'Adopt whichever tuning cites more of my notes.'],\n  ['Warm the index as soon as an assistant connects.', 'Warm it on the first search; most connections never search.'],\n  ['Chunk notes by heading, so a decision stays in one piece.', 'Chunk at a fixed size; headings vary too much.'],\n];\nconst APPS = [['Claude Code', 'recalled'], ['ChatGPT', 'recalled'], ['Claude', 'saved'], ['Codex', 'recalled']];\nconst MONTHS = ['Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'];\n// Relations people define for their own vault. They get the same controls as the built-in ones.\n// What the notes say, as Markdown. Links are [[wikilinks]]; observations are \"- [category] text\".\n// What the notes say, in Exomem's own note format: a lead paragraph, then sections; observations are\n// \"- [category] content #tags (context) ^anchor\"; relations are \"- type [[target]]\" under ## Relations.\nconst BODIES = {\n  'notes/newer-constraint.md': 'Retrieval stays local and on SQLite. Keywords go through FTS5, vectors through sqlite-vec, and both live in one file next to the vault.\\n## Why\\n[[sources/bench/run-014.md]] ran hybrid retrieval over 50,000 notes: 864 ms end to end, with a cold cache. That was the last reason for a separate search service, so this replaces [[notes/old-plan.md]].\\n## Observations\\n- [decision] No separate search service to run, back up or keep in sync #retrieval #ops ^no-search-service\\n- [constraint] The first query is slow while the index opens; see [[insights/first-latency.md]] #latency (cold start) ^cold-open\\n- [open question] Index on save or on a schedule is still open in [[research/cli-indexing.md]] #indexing ^index-timing\\n## Relations\\n- supersedes [[notes/old-plan.md]]\\n- evidenced_by [[sources/bench/run-014.md]]\\n- relates_to [[insights/first-latency.md]]',\n  'decisions/gpu-batching.md': 'Batch embeddings at 256 on 16 GB cards.\\n## Why\\nIn [[sources/bench/run-014.md]], batches above 256 ran out of VRAM while throughput stayed flat. VRAM headroom, not throughput, is the bound.\\n## Observations\\n- [decision] Default batch size is 256 on 16 GB cards #embeddings ^batch-256\\n- [method] Model choice comes from [[research/embedding-models.md]] #embeddings ^model-choice\\n## Relations\\n- evidenced_by [[sources/bench/run-014.md]]\\n- derived_from [[research/embedding-models.md]]',\n  'research/embedding-models.md': 'Five embedding models compared on this vault: recall at 10, latency, and size on disk.\\n## Sources\\n[[sources/papers/mteb-2026.md]] for the shortlist, [[sources/bench/run-009.md]] for the numbers on this vault.\\n## Observations\\n- [finding] A comparison, not a verdict #research ^not-a-verdict\\n- [used by] [[decisions/gpu-batching.md]] builds on it #embeddings ^used-by-batching',\n  'insights/first-latency.md': 'Cold-start latency is dominated by opening the index, not by retrieval.\\n## Why\\nIn [[sources/bench/run-014.md]], most of the first query\u2019s time went to opening the index; warm queries were fast.\\n## Observations\\n- [pattern] Warm the index when an assistant connects #latency (on connect) ^warm-on-connect\\n- [explains] The cold number in [[notes/newer-constraint.md]] #latency ^explains-cold\\n## Relations\\n- evidenced_by [[sources/bench/run-014.md]]\\n- refines [[notes/newer-constraint.md]]',\n  'sources/bench/run-014.md': 'Benchmark run 014: 50,000 notes, hybrid retrieval, 864 ms end to end with a cold cache.\\n## Setup\\n- [fact] 50,000 notes; hybrid retrieval with FTS5 and sqlite-vec #benchmark ^setup-size\\n- [fact] Cold cache, timed end to end #benchmark ^setup-timing\\n## Cited by\\n[[notes/newer-constraint.md]], [[decisions/gpu-batching.md]] and [[insights/first-latency.md]].',\n  'decisions/vault-layout.md': 'Notes live as plain Markdown in the vault; the index is a sidecar that can always be rebuilt from the files.\\n## Why\\nDecided on 2 Apr ([[sources/meeting-2026-04-02.md]]): the Markdown files stay the source of truth.\\n## Observations\\n- [decision] Deleting the index loses nothing; it rebuilds from the files #vault ^index-is-sidecar',\n  'research/cli-indexing.md': 'Should the CLI index on save or on a schedule? Two benchmarks disagree.\\n## What disagrees\\n[[sources/bench/run-012.md]] favours indexing on save; a later run favours a schedule.\\n## Observations\\n- [open question] Which matters more here: fresh recall, or instant saves? #indexing ^save-or-schedule',\n  'notes/old-plan.md': 'The first plan: run a separate vector database next to the vault.\\n## What happened\\nBenchmark run 014 showed SQLite alone stays under a second at 50,000 notes.\\n## Observations\\n- [superseded] Replaced by [[notes/newer-constraint.md]] on 3 Aug; kept for history #retrieval ^replaced\\n## Relations\\n- superseded_by [[notes/newer-constraint.md]]',\n};\n// Each kind of observation gets its own component: a mark, a colour rule, a frame.\nconst FAM = { decision: ['dec', '\u25c6'], constraint: ['con', '\u22a3'], 'open question': ['q', '?'], question: ['q', '?'], finding: ['find', '\u25cf'], fact: ['fact', '\u25a0'], pattern: ['pat', '\u21bb'], method: ['pat', '\u21bb'], superseded: ['sup', '\u21a7'], 'used by': ['rel', '\u2192'], explains: ['rel', '\u2192'], relates: ['rel', '\u2192'] };\nconst CUSTOM = ['inspired by', 'blocks release'];\nconst SPEEDS = [[0.5, '\u00bd\u00d7', 'half speed'], [1, '1\u00d7', 'normal speed'], [2, '2\u00d7', 'double speed']];\n\n// Dark is canonical and so is light: the same viewer on paper, with deep amber.\nconst VPAL = {\"dark\": {\"v0\": \"#ECE9E2\", \"v1\": \"#FFB000\", \"v2\": \"#858075\", \"v3\": \"#5C574D\", \"v4\": \"#0A0908\", \"v5\": \"#A39E93\", \"v6\": \"#1A1815\", \"v7\": \"#100E0C\", \"v8\": \"#12100E\", \"v9\": \"#2A2724\", \"v10\": \"#14120F\", \"v11\": \"#C9C5BC\", \"v12\": \"236,233,226\", \"v13\": \"255,176,0\", \"v14\": \"10,9,8\", \"v15\": \"rgba(0,0,0,.6)\"}, \"light\": {\"v0\": \"#1A1814\", \"v1\": \"#A86E00\", \"v
