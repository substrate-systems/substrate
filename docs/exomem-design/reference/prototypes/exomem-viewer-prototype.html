2); padding-bottom: 4px\">MOST CONNECTED<\/span>\n            <sc-for list=\"{{ top }}\" as=\"h\" hint-placeholder-count=\"4\">\n              <div class=\"prow\" onClick=\"{{ h.pick }}\"><span class=\"pt\" style=\"flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ h.t }}<\/span><span class=\"mono\" style=\"font-size: 11px; color: var(--v2)\">{{ h.d }} links<\/span><\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"margin-top: auto; font-size: 12.5px; color: var(--v2); line-height: 1.55\">Scroll to zoom, drag to move. Click a note to see why it\u2019s true. Press play to watch the vault grow.<\/div>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ isNote }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 18px; height: 100%\">\n          <div style=\"display: flex; gap: 8px; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px\">\n            <span style=\"padding: 3px 8px; border-radius: 4px; border: 1px solid {{ statusBorder }}; color: {{ statusColor }}\">{{ status }}<\/span>\n            <span style=\"color: var(--v2)\">{{ kind }}<\/span>\n            <button type=\"button\" class=\"ghost\" onClick=\"{{ goBack }}\" style=\"margin-left: auto\">{{ backLabel }}<\/button>\n          <\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 8px\">\n            <div class=\"mono\" style=\"font-weight: 500; font-size: 19px; letter-spacing: -0.01em; line-height: 1.3; overflow-wrap: anywhere\">{{ focusTitle }}<\/div>\n            <div style=\"font-size: 13.5px; line-height: 1.55; color: var(--v5)\">{{ summary }}<\/div>\n            <div><button type=\"button\" class=\"ghost\" onClick=\"{{ readIt }}\" style=\"padding: 2px 0; color: var(--v1); font-size: 12px\">Read the whole note \u2192<\/button><\/div>\n          <\/div>\n          <sc-if value=\"{{ hasSuper }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"mono\" style=\"font-size: 11.5px; color: {{ recalledCol }}\">{{ recalled }}<\/div>\n            <div style=\"display: flex; gap: 8px\"><button type=\"button\" class=\"btn amb\" onClick=\"{{ askWhy }}\">Why is this true?<\/button><button type=\"button\" class=\"btn pri\" onClick=\"{{ readIt }}\">Read the note<\/button><\/div>\n          <\/div>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ isRead }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"vscroll\" style=\"display: flex; flex-direction: column; gap: 18px; height: 100%; margin-right: -12px; padding-right: 12px\">\n          <span class=\"mono\" style=\"font-size: 11px; color: var(--v1); letter-spacing: .1em\">AROUND THIS NOTE<\/span>\n          <div style=\"display: flex; flex-direction: column; gap: 2px\">\n            <span class=\"mono\" style=\"font-size: 11px; color: var(--v2); padding-bottom: 4px\">LINKS \u00b7 {{ relCount }}<\/span>\n            <sc-for list=\"{{ rdGroups }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; flex-direction: column; padding: 6px 0; border-bottom: 1px solid rgba(var(--v12),.06)\">\n                <span class=\"mono\" style=\"font-size: 11px; color: {{ r.col }}; padding-bottom: 2px\">{{ r.k }}<\/span>\n                <sc-for list=\"{{ r.items }}\" as=\"it\" hint-placeholder-count=\"2\"><div class=\"prow\" onClick=\"{{ it.pick }}\" style=\"border: 0; padding: 4px 0\"><span class=\"pt\" style=\"flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ it.t }}<\/span><\/div><\/sc-for>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 2px\">\n            <span class=\"mono\" style=\"font-size: 11px; color: var(--v2); padding-bottom: 4px\">SOURCES<\/span>\n            <sc-for list=\"{{ sources }}\" as=\"s\" hint-placeholder-count=\"2\">\n              <div class=\"prow\" onClick=\"{{ s.pick }}\"><span class=\"mono\" style=\"color: var(--v1); font-size: 11px\">\u21b3<\/span><span class=\"pt\" style=\"flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ s.t }}<\/span><span class=\"mono\" style=\"font-size: 11px; color: var(--v2)\">{{ s.d }}<\/span><\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 2px\">\n            <span class=\"mono\" style=\"font-size: 11px; color: var(--v2); padding-bottom: 4px\">HISTORY<\/span>\n            <sc-for list=\"{{ rdHist }}\" as=\"h\" hint-placeholder-count=\"4\">\n              <div class=\"feed\"><span class=\"mono\" style=\"font-size: 11px; color: var(--v2); width: 84px; flex: none\">{{ h.k }}<\/span><span style=\"flex: 1; color: var(--v11)\">{{ h.t }}<\/span><\/div>\n            <\/sc-for>\n          <\/div>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ isWhy }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 16px; height: 100%\">\n          <div style=\"display: flex; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px\">\n            <span style=\"color: var(--v1); letter-spacing: .1em\">WHY EXOMEM BELIEVES THIS<\/span>\n            <button type=\"button\" class=\"ghost\" onClick=\"{{ backToNote }}\" style=\"margin-left: auto\">\u2190 the note<\/button>\n          <\/div>\n          <div class=\"mono\" style=\"font-weight: 500; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere\">{{ focusTitle }}<\/div>\n          <div style=\"font-size: 14px; line-height: 1.6; color: var(--v11)\">{{ whyAnswer }}<\/div>\n          <div style=\"display: flex; flex-direction: column\">\n            <span class=\"mono\" style=\"font-size: 11px; color: var(--v2); padding-bottom: 6px\">THE TRAIL \u00b7 {{ trailCount }}<\/span>\n            <sc-for list=\"{{ trail }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <div class=\"trow {{ t.c }}\" onClick=\"{{ t.pick }}\"><span class=\"mono\" style=\"font-size: 11px; color: var(--v2); width: 70px; flex: none\">{{ t.k }}<\/span><span class=\"pt\" style=\"flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ t.t }}<\/span><span class=\"mono\" style=\"font-size: 11px; color: var(--v3)\">{{ t.d }}<\/span><\/div>\n            <\/sc-for>\n          <\/div>\n          <sc-if value=\"{{ hasDoubt }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"card\" style=\"border-color: rgba(var(--v12),.16)\">\n              <span class=\"mono\" style=\"font-size: 11px; color: var(--v2)\">{{ doubtHead }}<\/span>\n              <span style=\"font-size: 13px\">{{ doubtTitle }}<\/span>\n              <div><button type=\"button\" class=\"ghost\" onClick=\"{{ doubtReview }}\" style=\"padding: 2px 0; color: var(--v1)\">Review the two side by side \u2192<\/button><\/div>\n            <\/div>\n          <\/sc-if>\n          <div style=\"margin-top: auto; display: flex; flex-direction: column; gap: 12px\"><div style=\"font-size: 12px; color: var(--v2); line-height: 1.55\">From your notes only. Every line links to its note; nothing here is invented.<\/div><div><button type=\"button\" class=\"btn\" onClick=\"{{ readIt }}\">Read the note<\/button><\/div><\/div>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ isReview }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 14px; height: 100%\">\n          <div style=\"display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px\">\n            <span style=\"color: var(--v1); letter-spacing: .1em\">REVIEW<\/span>\n            <span style=\"color: var(--v2)\">{{ rvPos }}<\/span>\n            <span style=\"margin-left: auto; display: flex; gap: 2px\"><button type=\"button\" class=\"ghost\" onClick=\"{{ rvPrev }}\" aria-label=\"Previous pair\">\u2190<\/button><button type=\"button\" class= as=\"it\" hint-placeholder-count=\"2\"><div class=\"prow\" onClick=\"{{ it.pick }}\" style=\"border: 0; padding: 4px 0\"><span class=\"pt\" style=\"flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ it.t }}<\/span><\/div><\/sc-for>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 2px\">\n            <span class=\"mono\" style=\"font-size: 11px; color: var(--v2); padding-bottom: 4px\">SOURCES<\/span>\n            <sc-for list=\"{{ sources }}\" as=\"s\" hint-placeholder-count=\"2\">\n              <div class=\"prow\" onClick=\"{{ s.pick }}\"><span class=\"mono\" style=\"color: var(--v1); font-size: 11px\">\u21b3<\/span><span class=\"pt\" style=\"flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ s.t }}<\/span><span class=\"mono\" style=\"font-size: 11px; color: var(--v2)\">{{ s.d }}<\/span><\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 2px\">\n            <span class=\"mono\" style=\"font-size: 11px; color: var(--v2); padding-bottom: 4px\">HISTORY<\/span>\n            <sc-for list=\"{{ rdHist }}\" as=\"h\" hint-placeholder-count=\"4\">\n              <div class=\"feed\"><span class=\"mono\" style=\"font-size: 11px; color: var(--v2); width: 84px; flex: none\">{{ h.k }}<\/span><span style=\"flex: 1; color: var(--v11)\">{{ h.t }}<\/span><\/div>\n            <\/sc-for>\n          <\/div>\n      <\/article>\n    <\/div>\n  <\/sc-if>\n<\/main>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"live\":{\"editor\":\"boolean\",\"default\":true},\"theme\":{\"editor\":\"enum\",\"default\":\"dark\",\"options\":[\"dark\",\"light\"]},\"device\":{\"editor\":\"enum\",\"default\":\"desktop\",\"options\":[\"desktop\",\"phone\"]},\"start\":{\"editor\":\"enum\",\"default\":\"overview\",\"options\":[\"overview\",\"note\",\"why\",\"read\",\"review\",\"types\",\"reviewed\"]},\"screenH\":{\"editor\":\"number\",\"default\":844},\"$preview\":{\"width\":1440,\"height\":900}}'>\n// Exomem's graph viewer over a sample vault. One colour: amber lights only what is live, retrieved or current.\n// Overview first; zoom and filter; details on demand. Click a note and the camera moves to it, its links gather\n// around it, labelled by type. Ask why, and the trail that backs it lights up. Disagreements wait for review.\nconst W = 1040, H = 700;\nconst HUBS = [\n  { t: 'notes/newer-constraint.md', kind: 'decision', status: 'current', domain: 'retrieval', sum: 'Retrieval stays local and on SQLite: FTS5 for keywords, sqlite-vec for vectors. No separate search service to run or keep in sync.', supOn: 'superseded 3 Aug \u00b7 after benchmark run 014', src: [['sources/bench/run-014.md', '12 Jul'], ['sources/meeting-2026-05-12.md', '12 May']],\n    why: 'Benchmark run 014 measured hybrid retrieval on SQLite alone at 864 ms, with 50,000 notes and a cold cache. That took away the reason for a separate search service.' },\n  { t: 'decisions/gpu-batching.md', kind: 'decision', status: 'current', domain: 'embeddings', sum: 'Batch embeddings at 256 on 16 GB cards. VRAM headroom, not throughput, is the bound.', src: [['sources/bench/run-014.md', '12 Jul']],\n    why: 'In run 014, batches above 256 ran out of VRAM on 16 GB cards while throughput stayed flat.' },\n  { t: 'research/embedding-models.md', kind: 'research', status: 'current', domain: 'research', sum: 'Five embedding models compared on this vault: recall at 10, latency, and size on disk.', src: [['sources/papers/mteb-2026.md', '20 Jun'], ['sources/bench/run-009.md', '24 Jun']],\n    why: 'It\u2019s a comparison, not a verdict: one paper and one benchmark run, both measured on this vault.' },\n  { t: 'insights/first-latency.md', kind: 'insight', status: 'current', domain: 'latency', sum: 'Cold-start latency is dominated by opening the index, not by retrieval. Warm it when an assistant connects.', src: [['sources/bench/run-014.md', '12 Jul']],\n    why: 'In run 014 most of the first query\u2019s time went to opening the index; warm queries were fast.' },\n  { t: 'sources/bench/run-014.md', kind: 'source', status: 'evidence', domain: 'benchmarks', sum: 'Benchmark run 014: 50,000 notes, hybrid retrieval, 864 ms end to end with a cold cache.', src: [],\n    why: 'It\u2019s evidence, not a conclusion: a recorded benchmark run. Notes cite it; it cites nothing.' },\n  { t: 'decisions/vault-layout.md', kind: 'decision', status: 'current', domain: 'vault', sum: 'Notes live as plain Markdown in the vault; the index is a sidecar that can always be rebuilt from the files.', src: [['sources/meeting-2026-04-02.md', '2 Apr']],\n    why: 'Decided on 2 Apr: the Markdown files stay the source of truth, so the index can always be rebuilt from them.' },\n  { t: 'research/cli-indexing.md', kind: 'research', status: 'open question', domain: 'indexing', sum: 'Should the CLI index on save or on a schedule? Two benchmarks disagree.', src: [['sources/bench/run-012.md', '5 Jul']],\n    why: 'It isn\u2019t settled. Two benchmarks disagree, so it stays an open question until one of them is superseded.' },\n];\nconst OLD_PLAN = 'notes/old-plan.md';\nconst OLD_SUM = 'The first plan: run a separate vector database next to the vault. Benchmark run 014 showed SQLite alone stays sub-second at 50,000 notes, so it was superseded.';\nconst NOTES = ['notes/index-rebuild.md', 'insights/rerank-cost.md', 'patterns/cache-warm.md', 'decisions/fts5.md', 'research/rrf-k.md', 'sources/issue-212.md', 'notes/vault-sync.md', 'insights/edge-cases.md', 'decisions/no-gpu-default.md', 'research/chunking.md', 'sources/meeting-2026-06-30.md', 'patterns/supersede-not-delete.md', 'notes/ocr-pipeline.md', 'insights/recall-at-10.md', 'research/hybrid-weights.md', 'decisions/plugin-route.md'];\nconst TYPES = ['supports', 'refines', 'contradicts', 'supersedes', 'relates'];\nconst TCOL = { supports: 'var(--v1)', refines: 'var(--v1)', contradicts: 'var(--v0)', supersedes: 'var(--v1)', relates: 'var(--v2)' };\nconst OTHER_TYPES = ['evidenced by', 'derived from', 'cites', 'answers', 'raises question', 'resolves', 'depends on', 'implements', 'mitigates', 'causes', 'caused by', 'blocks', 'tests', 'duplicates', 'used for', 'observed in', 'mentions', 'about entity', 'links to', 'part of', 'contains', 'extends', 'member of', 'owns', 'operates', 'produces', 'supplies', 'located at'];\n// What two notes say when they may disagree. The vault is about running a knowledge base, so its arguments are too.\nconst CLAIMS = [\n  ['Index each note when it\u2019s saved, so recall is never stale.', 'Index on a schedule; saving should never wait on the index.'],\n  ['Typed links should rank ahead of plain wikilinks in recall.', 'Plain wikilinks are enough; typing them adds work for no ranking gain.'],\n  ['Tune ranking from how I actually search; cited notes are the signal.', 'Keep ranking fixed; tuning from usage will drift.'],\n  ['Adopt a tuned ranking only if the golden queries don\u2019t get worse.', 'Adopt whichever tuning cites more of my notes.'],\n  ['Warm the index as soon as an assistant connects.', 'Warm it on the first search; most connections never search.'],\n  ['Chunk notes by heading, so a decision stays in one piece.', 'Chunk at a fixed size; headings vary too much.'],\n];\nconst APPS = [['Claude Code', 'recalled'], ['ChatGPT', 'recalled'], ['Claude', 'saved'], ['Codex', 'recalled']];\nconst MONTHS = ['Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'];\n// Relations people define for their own vault. They get the same controls as the built-in ones.\n// What the notes say, as Markdown. Links are [[wikilinks]]; observations are \"- [category] text\".\n// What the notes say, in Exomem's own note format: a lead paragraph, then sections; observations are\n// \"- [category] content #tags (context) ^anchor\"; relations are \"- type [[target]]\" under ## Relations.\nconst BODIES = {\n  'notes/newer-constraint.md': 'Retrieval stays local and on SQLite. Keywords go through FTS5, vectors through sqlite-vec, and both live in one file next to the vault.\\n## Why\\n[[sources/bench/run-014.md]] ran hybrid retrieval over 50,000 notes: 864 ms end to end, with a cold cache. That was the last reason for a separate search service, so this replaces [[notes/old-plan.md]].\\n## Observations\\n- [decision] No separate search service to run, back up or keep in sync #retrieval #ops ^no-search-service\\n- [constraint] The first query is slow while the index opens; see [[insights/first-latency.md]] #latency (cold start) ^cold-open\\n- [open question] Index on save or on a schedule is still open in [[research/cli-indexing.md]] #indexing ^index-timing\\n## Relations\\n- supersedes [[notes/old-plan.md]]\\n- evidenced_by [[sources/bench/run-014.md]]\\n- relates_to [[insights/first-latency.md]]',\n  'decisions/gpu-batching.md': 'Batch embeddings at 256 on 16 GB cards.\\n## Why\\nIn [[sources/bench/run-014.md]], batches above 256 ran out of VRAM while throughput stayed flat. VRAM headroom, not throughput, is the bound.\\n## Observations\\n- [decision] Default batch size is 256 on 16 GB cards #embeddings ^batch-256\\n- [method] Model choice comes from [[research/embedding-models.md]] #embeddings ^model-choice\\n## Relations\\n- evidenced_by [[sources/bench/run-014.md]]\\n- derived_from [[research/embedding-models.md]]',\n  'research/embedding-models.md': 'Five embedding models compared on this vault: recall at 10, latency, and size on disk.\\n## Sources\\n[[sources/papers/mteb-2026.md]] for the shortlist, [[sources/bench/run-009.md]] for the numbers on this vault.\\n## Observations\\n- [finding] A comparison, not a verdict #research ^not-a-verdict\\n- [used by] [[decisions/gpu-batching.md]] builds on it #embeddings ^used-by-batching',\n  'insights/first-latency.md': 'Cold-start latency is dominated by opening the index, not by retrieval.\\n## Why\\nIn [[sources/bench/run-014.md]], most of the first query\u2019s time went to opening the index; warm queries were fast.\\n## Observations\\n- [pattern] Warm the index when an assistant connects #latency (on connect) ^warm-on-connect\\n- [explains] The cold number in [[notes/newer-constraint.md]] #latency ^explains-cold\\n## Relations\\n- evidenced_by [[sources/bench/run-014.md]]\\n- refines [[notes/newer-constraint.md]]',\n  'sources/bench/run-014.md': 'Benchmark run 014: 50,000 notes, hybrid retrieval, 864 ms end to end with a cold cache.\\n## Setup\\n- [fact] 50,000 notes; hybrid retrieval with FTS5 and sqlite-vec #benchmark ^setup-size\\n- [fact] Cold cache, timed end to end #benchmark ^setup-timing\\n## Cited by\\n[[notes/newer-constraint.md]], [[decisions/gpu-batching.md]] and [[insights/first-latency.md]].',\n  'decisions/vault-layout.md': 'Notes live as plain Markdown in the vault; the index is a sidecar that can always be rebuilt from the files.\\n## Why\\nDecided on 2 Apr ([[sources/meeting-2026-04-02.md]]): the Markdown files stay the source of truth.\\n## Observations\\n- [decision] Deleting the index loses nothing; it rebuilds from the files #vault ^index-is-sidecar',\n  'research/cli-indexing.md': 'Should the CLI index on save or on a schedule? Two benchmarks disagree.\\n## What disagrees\\n[[sources/bench/run-012.md]] favours indexing on save; a later run favours a schedule.\\n## Observations\\n- [open question] Which matters more here: fresh recall, or instant saves? #indexing ^save-or-schedule',\n  'notes/old-plan.md': 'The first plan: run a separate vector database next to the vault.\\n## What happened\\nBenchmark run 014 showed SQLite alone stays under a second at 50,000 notes.\\n## Observations\\n- [superseded] Replaced by [[notes/newer-constraint.md]] on 3 Aug; kept for history #retrieval ^replaced\\n## Relations\\n- superseded_by [[notes/newer-constraint.md]]',\n};\n// Each kind of observation gets its own component: a mark, a colour rule, a frame.\nconst FAM = { decision: ['dec', '\u25c6'], constraint: ['con', '\u22a3'], 'open question': ['q', '?'], question: ['q', '?'], finding: ['find', '\u25cf'], fact: ['fact', '\u25a0'], pattern: ['pat', '\u21bb'], method: ['pat', '\u21bb'], superseded: ['sup', '\u21a7'], 'used by': ['rel', '\u2192'], explains: ['rel', '\u2192'], relates: ['rel', '\u2192'] };\nconst CUSTOM = ['inspired by', 'blocks release'];\nconst SPEEDS = [[0.5, '\u00bd\u00d7', 'half speed'], [1, '1\u00d7', 'normal speed'], [2, '2\u00d7', 'double speed']];\n\n// Dark is canonical and so is light: the same viewer on paper, with deep amber.\nconst VPAL = {\"dark\": {\"v0\": \"#ECE9E2\", \"v1\": \"#FFB000\", \"v2\": \"#858075\", \"v3\": \"#5C574D\", \"v4\": \"#0A0908\", \"v5\": \"#A39E93\", \"v6\": \"#1A1815\", \"v7\": \"#100E0C\", \"v8\": \"#12100E\", \"v9\": \"#2A2724\", \"v10\": \"#14120F\", \"v11\": \"#C9C5BC\", \"v12\": \"236,233,226\", \"v13\": \"255,176,0\", \"v14\": \"10,9,8\", \"v15\": \"rgba(0,0,0,.6)\"}, \"light\": {\"v0\": \"#1A1814\", \"v1\": \"#A86E00\", \"v2\": \"#7A756B\", \"v3\": \"#B5AFA3\", \"v4\": \"#FAF8F4\", \"v5\": \"#6B665C\", \"v6\": \"#EFEBE3\", \"v7\": \"#FFFFFF\", \"v8\": \"#FFFFFF\", \"v9\": \"#E5E0D6\", \"v10\": \"#FFFFFF\", \"v11\": \"#3D3A34\", \"v12\": \"26,24,20\", \"v13\": \"168,110,0\", \"v14\": \"250,248,244\", \"v15\": \"rgba(60,50,30,.16)\"}};\nconst base = (t) => t.split('/').pop();\nconst stopEv = (e) => { if (e && e.stopPropagation) e.stopPropagation(); };\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const s = props.start || 'overview', g = this.graph();\n    const mode = s === 'note' || s === 'why' || s === 'read' ? s : (s === 'review' || s === 'reviewed') ? 'review' : 'overview';\n    this.state = { focus: mode === 'note' || mode === 'why' || mode === 'read' ? g.hubs[0] : -1, mode, off: {}, asOf: 11, q: '', searchOpen: false, moreOpen: s === 'types', playing: false, speed: 1,\n      ev: [], evN: 0, now: 0, cam: null, drag: false, hist: [], hover: -1, paused: props.live === false, rv: 0, resolved: {}, over: {}, rvLast: null,\n      sheet: mode === 'why' || mode === 'review' ? 'open' : 'peek' };\n    if (s === 'reviewed') { const q = this.queue(this.state); if (q.length) { const [a, b] = q[0]; this.state = { ...this.state, ...this.resolveState(this.state, q[0], 'keepB') }; } }\n  }\n  componentDidMount() {\n    this.reduced = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (this.props.live === false) return;\n    this.fire(150000); this.fire(42000); this.fire(9000);\n    this.startLive();\n  }\n  componentWillUnmount() { this.gone = true; clearTimeout(this.beatT); clearInterval(this.liveT); clearInterval(this.playT); clearTimeout(this.fadeT); cancelAnimationFrame(this.gRaf); clearTimeout(this.hovT); clearTimeout(this.wheelT); this.musicStop(true); }\n  startLive() { clearInterval(this.liveT); this.liveT = setInterval(() => this.fire(), this.reduced ? 9000 : 4200); }\n\n  // ---- listening. Opt-in, from a quiet speaker in the corner: the microphone, or a song file. Nothing is recorded or sent.\n  musicStart(source) {\n    const AC = window.AudioContext || window.webkitAudioContext;\n    if (!AC) return this.setState({ muNote: 'This browser can\u2019t listen.', muErr: true });\n    this.musicStop(true);\n    const ctx = new AC(), an = ctx.createAnalyser();\n    an.fftSize = 2048; an.smoothingTimeConstant = 0.55; an.minDecibels = -85; an.maxDecibels = -20;\n    this.mu = { ctx, an, buf: new Uint8Array(an.frequencyBinCount), bass: 0, mid: 0, treb: 0, avg: 0.2, last: 0, lo: [0.3, 0.3, 0.3], hi: [0.6, 0.6, 0.6] };\n    if (!document.getElementById('vw-mu')) { const st = document.createElement('style'); st.id = 'vw-mu'; document.head.appendChild(st); }\n    source(ctx, an).then(() => { this.setState({ muOn: true, muPop: false, muErr: false }); this.musicLoop(); })\n      .catch(() => { this.musicStop(true); this.setState({ muNote: 'The microphone isn\u2019t available here. Try a song file instead.', muErr: true }); });\n  }\n  musicLoop() {\n    const m = this.mu; if (!m) return;\n    m.an.getByteFrequencyData(m.buf);\n    const hz = m.ctx.sampleRate / 2 / m.buf.length;\n    const band = (lo, hi) => { let s = 0, n = 0; for (let k = Math.max(1, Math.floor(lo / hz)); k <= Math.ceil(hi / hz) && k < m.buf.length; k++) { s += m.buf[k]; n++; } return n ? s / n / 255 : 0; };\n    const raw = [band(30, 160), band(400, 2000), band(4000, 12000)];\n    // each band against its own recent floor and ceiling, so a loud mix and a quiet one both move\n    const norm = raw.map((x, k) => {\n      m.lo[k] = x < m.lo[k] ? m.lo[k] + (x - m.lo[k]) * 0.3 : m.lo[k] + (x - m.lo[k]) * 0.004;\n      m.hi[k] = x > m.hi[k] ? m.hi[k] + (x - m.hi[k]) * 0.3 : m.hi[k] + (x - m.hi[k]) * 0.004;\n      const span = Math.max(0.08, m.hi[k] - m.lo[k]);\n      return Math.max(0, Math.min(1, (x - m.lo[k]) / span));\n    });\n    const ease = (v, x, up, dn) => v + (x - v) * (x > v ? up : dn);\n    m.bass = ease(m.bass, norm[0] * norm[0], 0.6, 0.14);\n    m.mid = ease(m.mid, norm[1], 0.4, 0.1);\n    m.treb = ease(m.treb, norm[2] * norm[2], 0.5, 0.16);\n    const el = document.getElementById('vw-mu');\n    if (el) el.textContent = `.vw{--bass:${m.bass.toFixed(3)};--mid:${m.mid.toFixed(3)};--treb:${m.treb.toFixed(3)}}`;\n    // a beat: the low end jumps well above its recent level, no more than about twice a second\n    m.avg = m.avg * 0.96 + raw[0] * 0.04;\n    const now = performance.now();\n    if (norm[0] > 0.72 && raw[0] > m.avg * 1.12 && now - m.last > 450) {\n      m.last = now;\n      const g = this.graph(), pick = () => Math.floor(Math.random() * g.E.length);\n      this.setState({ beatE: [pick(), pick()] });\n      clearTimeout(this.beatT); this.beatT = setTimeout(() => this.setState({ beatE: [] }), 900);\n    }\n    this.muRaf = requestAnimationFrame(() => this.musicLoop());\n  }\n  musicStop(quiet) {\n    cancelAnimationFrame(thi
