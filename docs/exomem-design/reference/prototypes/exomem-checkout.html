il\":{\"editor\":\"text\",\"default\":\"maria@example.com\"},\"usualPrice\":{\"editor\":\"text\",\"default\":\"\u20ac15\"},\"friendPrice\":{\"editor\":\"text\",\"default\":\"\u20ac10\"},\"discountMonths\":{\"editor\":\"number\",\"default\":0},\"sides\":{\"editor\":\"enum\",\"default\":\"none\",\"options\":[\"none\",\"chain\"]},\"screenH\":{\"editor\":\"number\",\"default\":844},\"graceDays\":{\"editor\":\"number\",\"default\":14},\"retentionDays\":{\"editor\":\"number\",\"default\":30},\"reference\":{\"editor\":\"text\",\"default\":\"EX-7Q4M\"},\"field\":{\"editor\":\"enum\",\"default\":\"web\",\"options\":[\"web\",\"graph\",\"stars\"]},\"mark\":{\"editor\":\"enum\",\"default\":\"dot\",\"options\":[\"dot\",\"held\",\"cut\"]},\"device\":{\"editor\":\"enum\",\"default\":\"desktop\",\"options\":[\"desktop\",\"phone\"]},\"still\":{\"editor\":\"boolean\",\"default\":false},\"accent\":{\"editor\":\"color\",\"default\":\"#FFB000\",\"options\":[\"#FFB000\",\"#FF6B3D\",\"#FFF1D6\",\"#E8C47C\",\"#C6F26B\"]},\"email\":{\"editor\":\"text\",\"default\":\"reader@example.com\"},\"price\":{\"editor\":\"text\",\"default\":\"\"},\"bg\":{\"editor\":\"color\",\"default\":\"#0A0908\"},\"panel\":{\"editor\":\"color\",\"default\":\"#12100E\"},\"fg\":{\"editor\":\"color\",\"default\":\"#ECE9E2\"},\"muted\":{\"editor\":\"color\",\"default\":\"#A39E93\"},\"$preview\":{\"width\":1280,\"height\":820}}'>\n// Every number on this page is computed at render: the link clock, the resend clock, the price (from Paddle, or nothing).\nconst AUTO = [['signedout', 3400], ['sent', 3800], ['connect', 3800], ['connecting', 2700], ['handback', 4800]];\n// Started on the web: the start page, then Claude's consent page (the app changes mid-way), then back to the start page.\nconst AUTO_WEB = [['signedout', 2800], ['sent', 3000], ['subscribe', 2400], ['paying', 2600], ['confirming', 1800], ['choose', 3000],\n  ['connect', 2600, 'Claude'], ['connecting', 2700, 'Claude'], ['handback', 3200, 'Claude'], ['joined', , \"name\": \"Light\", \"desc\": \"Searches when you ask, or when the topic is clearly its. Saves only when you ask.\", \"block\": \"I keep a personal Knowledge Base served by the Exomem MCP connector.\\n\\nExomem prominence: LIGHT.\\n- Recall: search Exomem only when I ask a recall question outright, or when the turn is unmistakably about a topic it covers. When in doubt, don't search.\\n- Capture: write to Exomem only when I ask. Do not save on your own judgment, however durable the conclusion looks.\\n- Narration: never mention searching. Fold anything you retrieve into the answer with a citation and nothing more.\"}, {\"key\": \"balanced\", \"name\": \"Balanced\", \"desc\": \"Searches when the topic matches. Saves conclusions. Stays quiet.\", \"block\": \"I use Exomem as my durable Knowledge Base. If no skill is loaded, call bootstrap(profile=\\\"compact\\\") once per chat and follow it.\\n\\nExomem prominence: BALANCED.\\n- Recall: search when a turn concerns my projects, domains, named entities, or prior conclusions, attempts, or decisions. Skip chit-chat, control, and answered follow-ups; cite useful hits.\\n- Capture: save at a stepping stone: a durable conclusion, reusable fact about a recurring entity, or a method carried out with a reported result. A stable preference, recurring routine, historical baseline, or durable affiliation qualifies only with stability or recurrence plus reusable comparison, interpretation, or decision value. Use a uniquely resolved Entity's narrow facet, else concise compiled observation: `proactive_capture`; Records only for a compatible measurement; affiliation relation: `link_acceptance`; new Entity: `proactive_capture`; merge/structural change: confirmed `restructure_execution`. Fleeting preferences, one-offs, incidental associations, trivial metrics, and tentative claims stay quiet. Not mid-thought exploration, tangents, or open questions. Never save transcripts.\\n- Entities: once per chat, after primary work and before the final response, review_memory(mode=\\\"attention\\\", categories=[\\\"entity_recurrence\\\"], limit=3); skip if unavailable.\\n- Narration: stay quiet; cite useful recalls and after a write say \\\"Saved -> <path>\\\".\\n- A committed final mutation result is authoritative despite adjacent warnings.\"}, {\"key\": \"maximal\", \"name\": \"Maximal\", \"desc\": \"Searches before every real question. Saves every step forward, and says so.\", \"block\": \"I use Exomem as my durable Knowledge Base. If no skill is loaded, call bootstrap(profile=\\\"compact\\\") once per chat and follow it.\\n\\nExomem prominence: MAXIMAL.\\n- Recall: search before every substantive turn; skip only chit-chat/control. Cite useful hits. An empty result is a scoped miss and reason to capture.\\n- Capture: save every stepping stone: decision, solved problem, diagnosed failure, reusable pattern, reusable fact about a recurring entity, or a method carried out with a reported useful result. A stable preference, recurring routine, historical baseline, or durable affiliation qualifies only with stability or recurrence plus reusable comparison, interpretation, or decision value. Use a uniquely resolved Entity's narrow facet, else concise compiled observation; these and a new Entity: `proactive_capture`; Records only for a compatible measurement; affiliation relation: `link_acceptance`; merge/structural change: confirmed `restructure_execution`. Fleeting preferences, one-offs, incidental associations, trivial metrics, and tentative claims stay quiet. When torn between saving and letting it pass, save. Never save transcripts.\\n- Entities: once per chat, after primary work and before the final response, review_memory(mode=\\\"attention\\\", categories=[\\\"entity_recurrence\\\"], limit=3); skip if unavailable.\\n- Narration: cite recalls; after a write say \\\"Saved -> <path>\\\".\\n- A committed final mutation result is authoritative; never invent a failure code from warnings.\"}];\nconst LINK_MS = 15 * 60 * 1000;\nconst REVIEWER_NOTE = 'It\u2019s a sample account with example notes, already subscribed, so there is no checkout.';\nconst RESEND_MS = 60 * 1000;\n\n// Exomem \"alive\" engine (round 41 proposal). One motion grammar for every graph:\n//   ambient \u2014 ink only, never amber: the system is on. Three directions: current, grow, tide.\n//   event   \u2014 amber, only when something happened (a recall, a save, a connection), always paired with text by the page.\n// It draws into an overlay <g> inside the graph's own <svg>: vectors only, lines stay 1 px at any scale\n// (vector-effect: non-scaling-stroke), dots grow by radius, never by transform. Off under reduced motion.\n// Attach: <svg data-alive=\"current|grow|tide|off\" data-graph='{\"n\":[[x,y,r],\u2026],\"e\":[[i,j],\u2026]}' data-ink=\"#\u2026\" data-amber=\"#\u2026\" data-alive-id=\"\u2026\" data-entry=\"x,y\">\n(function () {\n  if (typeof window === 'undefined' || window.__exoAlive) return;\n  const NS = 'http://www.w3.org/2000/svg';\n  const reducedQ = () => typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;\n  const mk = (tag, attrs, parent) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); if (parent) parent.appendChild(el); return el; };\n  const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;\n  const rnd = (a, b) => a + Math.random() * (b - a);\n  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];\n\n  class Alive {\n    constructor(svg) {\n      this.svg = svg; this.mode = svg.getAttribute('data-alive');\n      let g = {}; try { g = JSON.parse(svg.getAttribute('data-graph') || '{}'); } catch (e) {}\n      this.N = (g.n || []).map(([x, y, r]) => ({ x, y, r: r || 3 }));\n      this.E = (g.e || []).filter(([i, j]) => this.N[i] && this.N[j]);\n      this.adj = this.N.map(() => []); this.E.forEach(([i, j], k) => { this.adj[i].push([j, k]); this.adj[j].push([i, k
